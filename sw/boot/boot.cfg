# ============================================================================
# boot.cfg — ld65 layout for the boot ROM (build/bootrom.bin / .hex)
#
# The testbench maps rom[0] to CPU $8100, so the image starts there.
# $8000-$80FF is the I/O window and must never contain code or data.
# Unused ROM is filled with $EA (NOP).
# VECTORS ($FFF8-$FFFF): ret_user_mode, NMI, RESET, IRQ/BRK (see boot.s).
# ============================================================================
MEMORY {
    ROM:   start = $8100, size = $7EF8, type = ro, fill = yes, fillval = $EA;
    VECT:  start = $FFF8, size = $0008, type = ro, fill = yes;
}

SEGMENTS {
    CODE:    load = ROM,  type = ro;
    VECTORS: load = VECT, type = ro;
}
