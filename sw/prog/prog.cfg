# ============================================================================
# prog.cfg — ld65 layout for user programs (build/*.bbx)
#
# Virtual addresses inside the process (the MMU maps them per process):
#   $0030-$004F  cc65 zero-page variables
#   $0100-$01FF  hardware stack (virtual page 0)
#   $1000-$1005  BBX header ('BX', load address $1000, entry point)
#   $1006-      code, data, BSS (virtual pages 1-7)
#
# Note: the syscall ABI slots in syslib.s ($30-$40) overlap the cc65
# zero-page variables placed here at $30 (sp, sreg, regsave, ptr1, ...).
# ============================================================================
MEMORY {
    ZP:     start = $0030, size = $0020, type = rw, define = yes;
    HEADER: start = $1000, size = $0006, type = ro, fill = yes;
    PROG:   start = $1006, size = $6EFA, type = rw, fill = no;
}

SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    HDR:      load = HEADER, type = ro;
    CODE:     load = PROG,   type = ro;
    RODATA:   load = PROG,   type = ro;
    DATA:     load = PROG,   type = rw;
    BSS:      load = PROG,   type = bss, define = yes;
}
