# ============================================================================
# prog.cfg — ld65 layout for user programs (build/*.bbx)
#
# Virtual addresses inside the process (the MMU maps them per process):
#   ABI_BASE..   syscall ABI block (SYS_ABI_BASE / SYS_ABI_SIZE in common.mk)
#   then         cc65 zero-page variables (sp, sreg, regsave, ptr1, ...),
#                placed immediately after the ABI block
#   $0100-$01FF  hardware stack (virtual page 0)
#   $1000-$1005  BBX header ('BX', load address $1000, entry point)
#   $1006-      code, data, BSS (1 KB virtual pages 4 and up)
#
# __SYS_ABI_BASE__ / __SYS_ABI_SIZE__ are passed in by the Makefile
# (ld65 -D, see LD65_PROG_FLAGS), so nothing here is hardcoded. If the
# cc65 variables no longer fit in ZP, ld65 stops with "overflows memory area".
# ============================================================================
MEMORY {
    # Reserved for the syscall ABI: nothing is linked here, it only documents
    # the hole (the ZP area below starts after it).
    ABI:    start = __SYS_ABI_BASE__, size = __SYS_ABI_SIZE__, type = rw, file = "";
    # cc65's ZP runs from the end of the ABI block to the end of zero page,
    # so it can never spill past $FF: if it doesn't fit, ld65 errors out.
    ZP:     start = __SYS_ABI_BASE__ + __SYS_ABI_SIZE__,
            size  = $0100 - __SYS_ABI_BASE__ - __SYS_ABI_SIZE__, type = rw, define = yes;
    HEADER: start = $1000, size = $0006, type = ro, fill = yes;
    PROG:   start = $1006, size = $6EFA, type = rw, fill = no;
}

SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    HDR:      load = HEADER, type = ro;
    CODE:     load = PROG,   type = ro;
    RODATA:   load = PROG,   type = ro;
    DATA:     load = PROG,   type = rw;
    BSS:      load = PROG,   type = bss, define = yes;
}
