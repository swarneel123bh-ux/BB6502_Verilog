# ============================================================================
# kernel.cfg — ld65 layout for the kernel (build/kernel.bbx)
#
# The kernel lives in physical page 0 and runs in MMU kernel mode (identity
# mapped), so these are physical addresses:
#   $0000-$001F  cc65 zero-page variables (the kernel also uses fixed ZP
#                slots above $30, see src/include/zp.s)
#   $0100-$01FF  hardware stack
#   $0200-$0205  BBX header ('BX', load address, entry point)
#   $0206-$0FFF  code + data + BSS: the loaded kernel must fit below $1000
#                (1 KB MMU pages 0-3). KCODE is filled, so kernel.bbx is
#                always the full size of the area.
#   $7000-$7CFF  KHIGH: kernel-only BSS (process table, disk buffer). Not in
#                the image; physical 1 KB pages 28-30 belong to the kernel.
#   $7EFF down   the kernel's cc65 software stack (set in crt0.s), page 31.
# ============================================================================
MEMORY {
    ZP:     start = $0000, size = $0020, type = rw, define = yes;
    HEADER: start = $0200, size = $0006, type = rw, fill = yes;
    KCODE:  start = $0206, size = $0DFA, type = rw, fill = yes;
    KHIGH:  start = $7000, size = $0D00, type = rw, file = "";
}

SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    HDR:      load = HEADER, type = ro;
    STARTUP:  load = KCODE,  type = ro;
    CODE:     load = KCODE,  type = ro;
    RODATA:   load = KCODE,  type = ro;
    DATA:     load = KCODE,  type = rw;
    BSS:      load = KCODE,  type = bss, define = yes;
    KHIBSS:   load = KHIGH,  type = bss;
    VECTORS:  load = KCODE,  type = ro;            # not used; could drop
}
